<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المتجر</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--g:#0f5c4d;--y:#f2a900;--bg:#f2f5f3;--c:#fff;--t:#16221f;--m:#5d6b67;--l:#d8e0dc;--r:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Tajawal,Tahoma,sans-serif}.top{background:var(--g);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:21px}main{max-width:1050px;margin:auto;padding:18px}.box{background:#fff;border:1px solid var(--l);border-radius:12px;padding:18px;margin-bottom:14px}.box h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}label{display:block;font-weight:700;margin:9px 0 4px}input,textarea,select{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;font:inherit;background:#fff}button{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.main{background:var(--g);color:#fff}.sec{background:#fff;border:1px solid var(--l)}.danger{background:#b3261e;color:#fff}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l);padding:10px 0}.row:last-child{border:0}.thumb{width:55px;height:55px;object-fit:cover;border-radius:7px;background:var(--bg)}.actions{display:flex;gap:7px;flex-wrap:wrap}.muted{color:var(--m);font-size:14px}.err{color:var(--r);min-height:20px}.hide{display:none}.colorline{display:grid;grid-template-columns:1fr 90px 1fr auto;gap:6px;margin:6px 0}.colorline input[type=color]{padding:2px;height:42px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.status{padding:5px 9px;border-radius:20px;background:#eee}.orders{overflow:auto}.order{border:1px solid var(--l);border-radius:10px;padding:12px;margin:8px 0}.login{max-width:420px;margin:60px auto}.smallbtn{padding:7px 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.two{grid-template-columns:1fr}.colorline{grid-template-columns:1fr 70px 1fr}}
</style></head><body>
<header class="top"><h1>لوحة إدارة المتجر</h1><div><button class="sec" id="siteBtn" onclick="location.href='index.html'">فتح المتجر</button><button class="sec hide" id="logoutBtn" onclick="logout()">تسجيل الخروج</button></div></header>
<main>
<section id="loginBox" class="box login"><h2>دخول الإدارة</h2><p class="muted">استخدم حساب البريد وكلمة المرور الذي أنشأته في Supabase Auth.</p><label>البريد</label><input id="loginEmail" type="email"><label>كلمة المرور</label><input id="loginPass" type="password"><button class="main" style="width:100%;margin-top:12px" onclick="login()">دخول</button><div class="err" id="loginErr"></div></section>
<section id="app" class="hide"><div class="tabs"><button class="main" onclick="showTab('products')">المنتجات</button><button class="sec" onclick="showTab('settings')">إعدادات المتجر</button><button class="sec" onclick="showTab('orders')">الطلبات</button></div>
<section id="tab-products" class="box"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2>المنتجات</h2><button class="main" onclick="newProduct()">+ إضافة منتج</button></div><div id="productList"></div></section>
<section id="tab-settings" class="box hide"><h2>إعدادات المتجر</h2><div class="grid"><div><label>اسم المتجر</label><input id="s_name"><label>رسالة الترحيب</label><textarea id="s_welcome" rows="2"></textarea><label>الشحن (ج.م)</label><input id="s_shipping" type="number" min="0"></div><div><label>بريد استقبال الطلبات</label><input id="s_email" type="email"><label>واتساب المتجر</label><input id="s_whatsapp"><label>فودافون كاش</label><input id="s_vodafone"><label>اتصالات كاش</label><input id="s_etisalat"><label>أورانج كاش</label><input id="s_orange"></div></div><button class="main" onclick="saveSettings()">حفظ الإعدادات</button><div class="err" id="settingsErr"></div></section>
<section id="tab-orders" class="box hide"><div style="display:flex;justify-content:space-between;align-items:center"><h2>الطلبات</h2><button class="sec" onclick="loadOrders()">تحديث</button></div><div id="orders" class="orders">جارٍ التحميل...</div></section>
</section></main>
<div id="modal" class="hide" style="position:fixed;inset:0;background:#0008;padding:15px;overflow:auto"><div class="box" style="max-width:700px;margin:30px auto"><h2 id="modalTitle">منتج</h2><label>اسم المنتج</label><input id="p_name"><div class="two"><div><label>السعر</label><input id="p_price" type="number" min="0" step="0.01"></div><div><label>السعر القديم (اختياري)</label><input id="p_old" type="number" min="0" step="0.01"></div></div><label>الوصف</label><textarea id="p_desc" rows="3"></textarea><div class="two"><div><label>الإيموجي إذا لا توجد صورة</label><input id="p_emoji"></div><div><label>الصورة الرئيسية</label><input id="p_file" type="file" accept="image/*"><div class="muted">يفضل صورة أقل من 6MB.</div></div></div><label>الألوان</label><div id="colors"></div><button class="sec" onclick="addColor()">+ لون</button><label><input id="p_active" type="checkbox" style="width:auto"> المنتج ظاهر في المتجر</label><div class="actions" style="margin-top:15px"><button class="main" onclick="saveProduct()">حفظ</button><button class="sec" onclick="closeModal()">إلغاء</button></div><div class="err" id="modalErr"></div></div></div>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const {createClient}=supabase;const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);let current=null,products=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function init(){const {data:{session}}=await sb.auth.getSession();if(session)await enter();sb.auth.onAuthStateChange((_e,s)=>{if(s)enter();else leave()})}
async function login(){const email=$('loginEmail').value.trim(),password=$('loginPass').value;$('loginErr').textContent='';const {error}=await sb.auth.signInWithPassword({email,password});if(error)$('loginErr').textContent='بيانات الدخول غير صحيحة أو لم يتم إنشاء الحساب.'}
async function logout(){await sb.auth.signOut()}
function leave(){$('loginBox').classList.remove('hide');$('app').classList.add('hide');$('logoutBtn').classList.add('hide')}
async function enter(){const {data:{user}}=await sb.auth.getUser();const {data:ok,error}=await sb.rpc('is_admin');if(error||!ok){await sb.auth.signOut();$('loginErr').textContent='هذا الحساب ليس مضافًا كمدير في جدول admins.';return}$('loginBox').classList.add('hide');$('app').classList.remove('hide');$('logoutBtn').classList.remove('hide');await loadProducts();await loadSettings()}
function showTab(t){['products','settings','orders'].forEach(x=>$('tab-'+x).classList.toggle('hide',x!==t));if(t==='orders')loadOrders()}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);products=data||[];$('productList').innerHTML=products.length?products.map(p=>`<div class="row"><div style="display:flex;align-items:center;gap:10px">${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:`<div class="thumb" style="display:grid;place-items:center;font-size:28px">${esc(p.emoji||'🛍️')}</div>`}<div><b>${esc(p.name)}</b><div class="muted">${Number(p.price).toLocaleString('ar-EG')} ج.م ${p.active?'• ظاهر':'• مخفي'}</div></div></div><div class="actions"><button class="sec smallbtn" onclick="editProduct('${p.id}')">تعديل</button><button class="danger smallbtn" onclick="deleteProduct('${p.id}')">حذف</button></div></div>`).join(''):'لا توجد منتجات.'}
async function loadSettings(){const {data,error}=await sb.from('store_settings').select('*').eq('id',1).single();if(error)return;$('s_name').value=data.store_name||'';$('s_welcome').value=data.welcome_message||'';$('s_shipping').value=data.shipping||0;$('s_email').value=data.order_email||'';$('s_whatsapp').value=data.whatsapp||'';$('s_vodafone').value=data.vodafone||'';$('s_etisalat').value=data.etisalat||'';$('s_orange').value=data.orange||''}
async function saveSettings(){const {error}=await sb.from('store_settings').upsert({id:1,store_name:$('s_name').value.trim(),welcome_message:$('s_welcome').value.trim(),shipping:Number($('s_shipping').value||0),order_email:$('s_email').value.trim(),whatsapp:$('s_whatsapp').value.trim(),vodafone:$('s_vodafone').value.trim(),etisalat:$('s_etisalat').value.trim(),orange:$('s_orange').value.trim(),updated_at:new Date().toISOString()});$('settingsErr').textContent=error?error.message:'تم حفظ الإعدادات بنجاح.'}
function newProduct(){current=null;$('modalTitle').textContent='إضافة منتج';$('p_name').value='';$('p_price').value='';$('p_old').value='';$('p_desc').value='';$('p_emoji').value='🛍️';$('p_file').value='';$('p_active').checked=true;$('colors').innerHTML='';addColor();$('modalErr').textContent='';$('modal').classList.remove('hide')}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;current=p;$('modalTitle').textContent='تعديل المنتج';$('p_name').value=p.name;$('p_price').value=p.price;$('p_old').value=p.old_price??'';$('p_desc').value=p.description||'';$('p_emoji').value=p.emoji||'🛍️';$('p_file').value='';$('p_active').checked=!!p.active;$('colors').innerHTML='';(Array.isArray(p.colors)?p.colors:[]).forEach(c=>addColor(c));$('modalErr').textContent='';$('modal').classList.remove('hide')}
function closeModal(){$('modal').classList.add('hide')}
function addColor(c={}){const d=document.createElement('div');d.className='colorline';d.innerHTML=`<input class="cn" placeholder="اسم اللون" value="${esc(c.name||'')}"><input class="ch" type="color" value="${/^#[0-9a-f]{6}$/i.test(c.hex||'')?c.hex:'#dddddd'}"><input class="ci" placeholder="رابط صورة هذا اللون (اختياري)" value="${esc(c.image_url||'')}"><button class="danger smallbtn" onclick="this.parentElement.remove()">×</button>`;$('colors').appendChild(d)}
async function upload(file){if(!file)return '';if(file.size>6*1024*1024)throw new Error('الصورة أكبر من 6MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=crypto.randomUUID()+'.'+(ext||'jpg');const {error}=await sb.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false});if(error)throw error;return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}
async function saveProduct(){const name=$('p_name').value.trim();if(!name){$('modalErr').textContent='اكتب اسم المنتج.';return}const btn=document.querySelector('#modal .main');btn.disabled=true;btn.textContent='جارٍ الحفظ...';try{let image=current?.image_url||'';if($('p_file').files[0])image=await upload($('p_file').files[0]);const colors=[...document.querySelectorAll('.colorline')].map(x=>({name:x.querySelector('.cn').value.trim(),hex:x.querySelector('.ch').value,image_url:x.querySelector('.ci').value.trim()})).filter(x=>x.name||x.image_url);const payload={name,price:Number($('p_price').value||0),old_price:$('p_old').value?Number($('p_old').value):null,description:$('p_desc').value.trim(),emoji:$('p_emoji').value.trim()||'🛍️',image_url:image,colors,active:$('p_active').checked,updated_at:new Date().toISOString()};let res=current?await sb.from('products').update(payload).eq('id',current.id):await sb.from('products').insert(payload);if(res.error)throw res.error;closeModal();await loadProducts()}catch(e){$('modalErr').textContent=e.message||'حدث خطأ.'}finally{btn.disabled=false;btn.textContent='حفظ'}}
async function deleteProduct(id){if(!confirm('حذف هذا المنتج؟'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)alert(error.message);else loadProducts()}
async function loadOrders(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(error){$('orders').textContent=error.message;return}$('orders').innerHTML=data?.length?data.map(o=>`<div class="order"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(o.order_number)}</b><span class="status">${esc(o.status)}</span></div><p><b>${esc(o.customer_name)}</b> — ${esc(o.phone)}<br>${esc(o.governorate)} / ${esc(o.city)} / ${esc(o.area)} / ${esc(o.street)}</p><p>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.quantity}`).join('، ')}</p><b>الإجمالي: ${Number(o.total).toLocaleString('ar-EG')} ج.م</b><div class="actions" style="margin-top:8px"><select id="st-${o.id}"><option value="pending">جديد</option><option value="confirmed">مؤكد</option><option value="shipped">تم الشحن</option><option value="delivered">تم التسليم</option><option value="cancelled">ملغي</option></select><button class="main smallbtn" onclick="updateStatus('${o.id}')">تحديث الحالة</button></div></div>`).join(''):'لا توجد طلبات.';data?.forEach(o=>{const el=$('st-'+o.id);if(el)el.value=o.status})}
async function updateStatus(id){const status=$('st-'+id).value;const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert(error.message);else loadOrders()}
init();
</script></body></html>
