<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجري</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#123f3a;--g-d:#0a2b27;--g-t:#e6efec;--y:#c98a2b;--y-d:#a5701c;--bg:#f7f5f0;--c:#fff;--t:#20241f;--m:#6c756e;--l:#e2e1d8;--r:#b3392c}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
header{background:var(--g);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:12px;box-shadow:0 2px 10px rgba(10,43,39,.18)}header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}.welcome{max-width:960px;margin:14px auto 0;padding:0 18px;color:var(--m)}
.cartbtn,.main{background:var(--y);color:#231705;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer;transition:background .15s}.cartbtn:hover,.main:hover{background:var(--y-d)}.main{background:var(--g);color:#fff}.main:hover{background:var(--g-d)}.sec{background:#fff;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:10px;font:inherit;cursor:pointer;transition:border-color .15s}.sec:hover{border-color:var(--g)}
main{max-width:960px;margin:0 auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.p{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px}.p img{width:100%;height:180px;object-fit:cover;border-radius:9px;background:var(--bg)}.p .e{font-size:54px;text-align:center;background:var(--bg);border-radius:8px;padding:8px}.p h3{margin:0;font-size:17px}.desc{color:var(--m);font-size:14px}.pr{font-weight:800;color:var(--g);font-size:18px}.old{text-decoration:line-through;color:var(--m);font-size:14px;margin-right:6px}.add{margin-top:auto;background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:700;cursor:pointer;transition:background .15s}.add:hover{background:var(--g-d)}.colors{display:flex;flex-wrap:wrap;gap:6px}.color{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--l);cursor:pointer}.color.active{box-shadow:0 0 0 2px var(--g)}
.box{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:18px;margin-bottom:14px}.box h2{margin:0 0 12px;font-size:20px}.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.row .n{flex:1}.q button{width:30px;height:30px;border:1px solid var(--l);background:#fff;border-radius:6px;cursor:pointer;font-size:16px}.q span{display:inline-block;min-width:26px;text-align:center}.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:10px;color:var(--g-d)}label{display:block;font-weight:500;margin:10px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;font:inherit;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:1px;border-color:var(--g)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.pay{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}.pay input{width:auto;margin-top:6px}.pay small{display:block;color:var(--m)}.pay:has(input:checked){border-color:var(--g);background:var(--g-t)}.note{background:#faf1e2;border:1px solid #e3c691;color:#5c4415;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}.err{color:var(--r);font-size:14px;margin-top:8px;min-height:20px}.nav{display:flex;gap:10px;margin-top:12px}.nav button{flex:1}.hide{display:none}.loading{text-align:center;padding:35px;color:var(--m)}.empty{text-align:center;padding:35px;color:var(--m)}
</style>
</head>
<body>
<header><h1 id="shop">متجري</h1><button class="cartbtn" onclick="go('cart')">السلة (<span id="cnt">0</span>)</button></header>
<div class="welcome" id="welcome"></div>
<main>
<section id="v-shop"><div class="loading" id="loading">جارٍ تحميل المنتجات...</div><div class="grid" id="grid"></div></section>
<section id="v-cart" class="hide"><div class="box"><h2>سلة الشراء</h2><div id="items"></div><div class="tot"><span>الإجمالي</span><span id="sum">0</span></div></div><div class="nav"><button class="sec" onclick="go('shop')">متابعة التسوق</button><button class="main" onclick="checkout()">إتمام الطلب</button></div><div class="err" id="e-cart"></div></section>
<section id="v-info" class="hide"><div class="box"><h2>بيانات العميل</h2><label>الاسم بالكامل</label><input id="name" autocomplete="name"><div class="two"><div><label>رقم الهاتف</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div><div><label>رقم واتساب (اختياري)</label><input id="wa" type="tel" inputmode="tel"></div></div><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email"><div class="two"><div><label>المحافظة</label><select id="gov"></select></div><div><label>المركز / المدينة</label><input id="city"></div></div><div class="two"><div><label>القرية / الحي</label><input id="area"></div><div><label>الشارع ورقم العقار</label><input id="street"></div></div><label>علامة مميزة قريبة (اختياري)</label><input id="mark" placeholder="بجوار مسجد / مدرسة ..."><label>ملاحظات على الطلب (اختياري)</label><textarea id="notes" rows="2"></textarea><div class="err" id="e-info"></div></div><div class="nav"><button class="sec" onclick="go('cart')">رجوع</button><button class="main" onclick="toPay()">التالي: طريقة الدفع</button></div></section>
<section id="v-pay" class="hide"><div class="box"><h2>طريقة الدفع</h2><div id="pays"></div><div id="payx" class="hide"><label>رقم المحفظة التي حوّلت منها</label><input id="payn" type="tel" inputmode="tel"></div><div class="note hide" id="paynote"></div><div class="err" id="e-pay"></div></div><div class="box"><div class="tot"><span>إجمالي الطلب</span><span id="sum2">0</span></div></div><div class="nav"><button class="sec" onclick="go('info')">رجوع</button><button class="main" id="send" onclick="submitOrder()">تأكيد الطلب</button></div></section>
<section id="v-done" class="hide"><div class="box"><h2>تم استلام طلبك ✅</h2><p id="donemsg"></p><button class="main" onclick="reset()">العودة للمتجر</button></div></section>
</main>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);const CURRENCY='ج.م';
const GOVS=['القاهرة','الجيزة','الإسكندرية','القليوبية','الشرقية','الدقهلية','الغربية','المنوفية','كفر الشيخ','البحيرة','دمياط','بورسعيد','الإسماعيلية','السويس','شمال سيناء','جنوب سيناء','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد','مطروح'];
let PRODUCTS=[],SETTINGS={shipping:0},cart={},pay='';
const fmt=n=>Number(n||0).toLocaleString('ar-EG')+' '+CURRENCY;const sub=()=>PRODUCTS.reduce((s,p)=>s+(cart[p.id]||0)*Number(p.price),0);const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
async function load(){try{const [{data:ps,error:pe},{data:st,error:se}]=await Promise.all([sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false}),sb.from('store_settings').select('*').eq('id',1).single()]);if(pe)throw pe;if(se)throw se;PRODUCTS=ps||[];SETTINGS=st||SETTINGS;$('shop').textContent=SETTINGS.store_name||'متجري';$('welcome').textContent=SETTINGS.welcome_message||'';renderProducts();renderPays();$('gov').innerHTML='<option value="">اختر المحافظة</option>'+GOVS.map(g=>`<option>${g}</option>`).join('');}catch(e){$('loading').textContent='تعذّر تحميل المتجر. تأكد من تشغيل schema.sql في Supabase.';console.error(e);}}
function renderProducts(){$('loading').classList.add('hide');if(!PRODUCTS.length){$('grid').innerHTML='<div class="empty">لا توجد منتجات متاحة حاليًا.</div>';return}$('grid').innerHTML=PRODUCTS.map(p=>{const colors=Array.isArray(p.colors)?p.colors:[];return `<article class="p" data-id="${p.id}">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:`<div class="e">${esc(p.emoji||'🛍️')}</div>`}<h3>${esc(p.name)}</h3><div class="desc">${esc(p.description||'')}</div><div class="pr">${fmt(p.price)} ${p.old_price?`<span class="old">${fmt(p.old_price)}</span>`:''}</div>${colors.length?`<div class="colors">${colors.map((c,i)=>`<button class="color ${i===0?'active':''}" title="${esc(c.name||'')}" style="background:${esc(c.hex||'#ddd')}" onclick="pickColor('${p.id}',${i},this)" aria-label="${esc(c.name||'لون')}"></button>`).join('')}</div>`:''}<button class="add" onclick="add('${p.id}')">أضف للسلة</button></article>`}).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function pickColor(id,i,el){el.parentElement.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));el.classList.add('active');const p=PRODUCTS.find(x=>x.id===id),c=(p.colors||[])[i];if(c?.image_url){const img=el.closest('.p').querySelector('img');if(img)img.src=c.image_url}}
function renderPays(){const m=SETTINGS;const pays=[];if(m.vodafone)pays.push(['vodafone','فودافون كاش','حوّل على: '+m.vodafone,true]);if(m.etisalat)pays.push(['etisalat','اتصالات كاش','حوّل على: '+m.etisalat,true]);if(m.orange)pays.push(['orange','أورانج كاش','حوّل على: '+m.orange,true]);pays.push(['cod','الدفع نقدًا عند الاستلام','تدفع للمندوب عند وصول الطلب',false]);pays.push(['visa','فيزا / بطاقة بنكية','سيتم التواصل معك بعد الطلب لتأكيد طريقة الدفع',false]);$('pays').innerHTML=pays.map(p=>`<label class="pay"><input type="radio" name="pay" value="${p[0]}" onchange="pickPay('${p[0]}','${esc(p[1])}',${p[3]})"><span><b>${p[1]}</b><small>${p[2]}</small></span></label>`).join('')}
function go(v){['shop','cart','info','pay','done'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==v));if(v==='cart')drawCart();scrollTo(0,0)}function add(id){cart[id]=(cart[id]||0)+1;upd()}function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];upd();drawCart()}function upd(){$('cnt').textContent=count()}
function drawCart(){const rows=PRODUCTS.filter(p=>cart[p.id]).map(p=>`<div class="row"><span>${esc(p.emoji||'🛍️')}</span><span class="n">${esc(p.name)}<br><small>${fmt(p.price)}</small></span><span class="q"><button onclick="chg('${p.id}',-1)">−</button><span>${cart[p.id]}</span><button onclick="chg('${p.id}',1)">+</button></span></div>`).join('');$('items').innerHTML=rows||'<p>السلة فارغة. أضف منتجات من المتجر.</p>';$('sum').textContent=fmt(sub())}
function checkout(){if(!count()){$('e-cart').textContent='أضف منتجًا واحدًا على الأقل.';return}$('e-cart').textContent='';go('info')}
function toPay(){const n=$('name').value.trim(),ph=$('phone').value.trim(),em=$('email').value.trim();let e='';if(n.length<3)e='اكتب الاسم بالكامل.';else if(!/^01[0-25]\d{8}$/.test(ph.replace(/\s|-/g,'')))e='رقم الهاتف غير صحيح.';else if(!/^\S+@\S+\.\S+$/.test(em))e='البريد الإلكتروني غير صحيح.';else if(!$('gov').value)e='اختر المحافظة.';else if(!$('city').value.trim())e='اكتب المركز أو المدينة.';else if(!$('street').value.trim()&&!$('area').value.trim())e='اكتب العنوان بالتفصيل (الحي أو الشارع).';$('e-info').textContent=e;if(e)return;$('sum2').textContent=fmt(sub()+Number(SETTINGS.shipping||0));go('pay')}
function pickPay(k,n,w){pay=k;$('payx').classList.toggle('hide',!w);const nt=$('paynote');nt.classList.remove('hide');nt.textContent=w?'حوّل المبلغ الإجمالي ثم اكتب رقم المحفظة التي حوّلت منها.':k==='cod'?'ستدفع قيمة الطلب والشحن للمندوب عند الاستلام.':'لا تكتب بيانات البطاقة هنا. سنتواصل معك لتأكيد الطلب.'}
async function submitOrder(){if(!pay){$('e-pay').textContent='اختر طريقة الدفع.';return}const wallet=$('payn').value.trim();if(['vodafone','etisalat','orange'].includes(pay)&&wallet.length<11){$('e-pay').textContent='اكتب رقم المحفظة التي حوّلت منها.';return}const items=PRODUCTS.filter(p=>cart[p.id]).map(p=>({product_id:p.id,name:p.name,price:Number(p.price),quantity:cart[p.id],line_total:Number(p.price)*cart[p.id]}));const shipping=Number(SETTINGS.shipping||0),subtotal=sub(),total=subtotal+shipping;const id='ORD-'+Date.now().toString().slice(-8);const paymentName={vodafone:'فودافون كاش',etisalat:'اتصالات كاش',orange:'أورانج كاش',cod:'الدفع نقدًا عند الاستلام',visa:'فيزا / بطاقة بنكية'}[pay];$('e-pay').textContent='';$('send').disabled=true;$('send').textContent='جارٍ حفظ الطلب...';try{const {error}=await sb.from('orders').insert({order_number:id,customer_name:$('name').value.trim(),phone:$('phone').value.trim(),whatsapp:$('wa').value.trim(),email:$('email').value.trim(),governorate:$('gov').value,city:$('city').value.trim(),area:$('area').value.trim(),street:$('street').value.trim(),landmark:$('mark').value.trim(),notes:$('notes').value.trim(),items,subtotal,shipping,total,payment_method:paymentName,wallet_number:wallet,status:'pending'});if(error)throw error;$('donemsg').textContent='رقم طلبك '+id+'. تم حفظ الطلب بنجاح وسنتواصل معك لتأكيده.';go('done')}catch(e){console.error(e);$('e-pay').textContent='تعذّر حفظ الطلب. تأكد من تشغيل schema.sql ومن إعداد سياسات RLS.'}finally{$('send').disabled=false;$('send').textContent='تأكيد الطلب'}}
function reset(){cart={};upd();pay='';go('shop')}
load();
</script>
</body></html>
